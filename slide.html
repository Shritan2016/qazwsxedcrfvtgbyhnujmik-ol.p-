<!DOCTYPE html>
<html>

<body>
    <!-- Slide Show -->
    <section>
        <img class="mySlides" src="pic.jpg" style="height:400px;">
        <img class="mySlides" src="pic10.jpg" style="height:400px;">
        <img class="mySlides" src="pic7.jpg" style="height:400px;">
        <img class="mySlides" src="pic5.jpg" style="height:400px;">
        <img class="mySlides" src="pic6.jpg" style="height:400px;">
    </section>

    <script>
      // Automatic Slideshow - change image every 3 seconds
        var myIndex = 0;
        carousel();

        function carousel() {
        var i;
        var x = document.getElementsByClassName("mySlides");
        for (i = 0; i < x.length; i++) {
        x[i].style.display = "none";
        }
        myIndex++;
        if (myIndex > x.length) {myIndex = 1}
        x[myIndex-1].style.display = "block";
         setTimeout(carousel, 3000);
      }
    </script>
   </body>
</html>
